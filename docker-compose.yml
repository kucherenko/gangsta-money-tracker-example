name: money

services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: money-backend:latest
    container_name: money-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      # General
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      # Admin Credentials (change in production)
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Security
      - JWT_SECRET=${JWT_SECRET}
      # Database
      - DB_PATH=/app/backend/db/data.sqlite
      # External APIs
      - RATE_API_URL=${RATE_API_URL}
      # Ollama (receipt OCR)
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      # Frontend Static Files
      - STATIC_DIR=/app/frontend/dist
    depends_on:
      - ollama
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - app-data:/app/backend/db
      - receipt-temp:/app/backend/data/temp_receipts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama: {}
  app-data: {}
  receipt-temp: {}
