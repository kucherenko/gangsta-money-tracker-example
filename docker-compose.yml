name: money

services:
  # ─── Ollama (receipt OCR backend) ────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: money-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - money
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 2G
    # If you need GPU support on Linux, uncomment the lines below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── Backend (API + Static SPA) ─────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: money-backend:latest
    container_name: money-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - STATIC_DIR=/app/frontend/dist
      - DB_PATH=/app/backend/db/data.sqlite
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - app-data:/app/backend/db
      - receipt-temp:/app/backend/data/temp_receipts
    networks:
      - money
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ollama-data:
    driver: local
  app-data:
    driver: local
  receipt-temp:
    driver: local

networks:
  money:
    driver: bridge
    name: money
