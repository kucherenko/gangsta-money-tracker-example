name: money

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: money-backend:latest
    container_name: money-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3001}"
    environment:
      # General
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3001}
      # Admin Credentials (change in production)
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # Security
      - JWT_SECRET=${JWT_SECRET:-money-tracker-secret-key}
      # Database
      - DB_PATH=${DB_PATH:-/app/backend/db/data.sqlite}
      # External APIs
      - RATE_API_URL=${RATE_API_URL:-https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies}
      # Ollama (receipt OCR)
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3-vl:235b-cloud}
      # Frontend Static Files
      - STATIC_DIR=${STATIC_DIR:-/app/frontend/dist}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - app-data:/app/backend/db
      - receipt-temp:/app/backend/data/temp_receipts
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data: {}
  receipt-temp: {}
